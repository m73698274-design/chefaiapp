
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chef AI Studio - شيف المطبخ الذكي</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary: #FF5722;
            --primary-light: #FBE9E7;
            --accent: #FFC107;
            --bg-color: #F8F9FA;
            --card-bg: #FFFFFF;
            --text-main: #2D3748;
            --text-muted: #718096;
            --border-radius: 18px;
            --shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Tajawal', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            min-height: 100vh;
            padding: 15px;
        }

        .app-container {
            width: 100%;
            max-width: 480px;
            background: var(--card-bg);
            border-radius: var(--border-radius);
            box-shadow: var(--shadow);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            position: relative;
            min-height: 90vh;
        }

        .header {
            background: linear-gradient(135deg, #FF5722, #FF8A65);
            color: white;
            padding: 20px;
            text-align: center;
            border-bottom-left-radius: 25px;
            border-bottom-right-radius: 25px;
            box-shadow: 0 4px 15px rgba(255, 87, 34, 0.2);
        }

        .header h1 {
            font-size: 1.5rem;
            font-weight: 800;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .header p {
            font-size: 0.85rem;
            opacity: 0.9;
            margin-top: 5px;
        }

        .content {
            padding: 20px;
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 20px;
            overflow-y: auto;
        }

        .section-title {
            font-size: 1rem;
            font-weight: 700;
            color: var(--text-main);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .ai-box {
            background: #FFF;
            border: 2px solid var(--primary-light);
            border-radius: var(--border-radius);
            padding: 15px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        textarea {
            width: 100%;
            height: 90px;
            border: 1px solid #E2E8F0;
            border-radius: 12px;
            padding: 12px;
            resize: none;
            font-size: 0.95rem;
            outline: none;
            transition: 0.3s;
        }

        textarea:focus {
            border-color: var(--primary);
        }

        .btn-primary {
            background: var(--primary);
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 12px;
            font-weight: 700;
            font-size: 1rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: 0.2s;
            box-shadow: 0 4px 12px rgba(255, 87, 34, 0.3);
        }

        .btn-primary:active {
            transform: scale(0.98);
        }

        .chips-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .chip {
            background: #EDF2F7;
            padding: 8px 14px;
            border-radius: 20px;
            font-size: 0.85rem;
            cursor: pointer;
            user-select: none;
            transition: 0.2s;
        }

        .chip.active {
            background: var(--primary);
            color: white;
        }

        .recipe-card {
            background: white;
            border-radius: var(--border-radius);
            border: 1px solid #E2E8F0;
            padding: 20px;
            box-shadow: var(--shadow);
            display: none;
            flex-direction: column;
            gap: 15px;
            animation: fadeIn 0.4s ease-in-out forwards;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .recipe-title {
            font-size: 1.3rem;
            font-weight: 800;
            color: var(--primary);
        }

        .recipe-meta {
            display: flex;
            gap: 15px;
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        .ingredients-list, .steps-list {
            padding-right: 20px;
            font-size: 0.95rem;
            line-height: 1.6;
        }

        .ingredients-list li, .steps-list li {
            margin-bottom: 8px;
        }

        .loader {
            display: none;
            text-align: center;
            padding: 20px;
            color: var(--primary);
            font-weight: 700;
        }

        .loader i {
            font-size: 2rem;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

<div class="app-container">
    <div class="header">
        <h1><i class="fa-solid fa-wand-magic-sparkles"></i> Chef AI Studio</h1>
        <p>مساعد الطبخ الذكي لوصفات سريعة ومبتكرة</p>
    </div>

    <div class="content">
        <!-- قسم إدخال الطلب -->
        <div class="section-title">
            <i class="fa-solid fa-utensils"></i> ماذا تحب أن تطبخ اليوم؟
        </div>

        <div class="ai-box">
            <textarea id="userInput" placeholder="مثال: أريد عشاء صحي ولذيذ بالدجاج في 15 دقيقة فقط..."></textarea>
            
            <div class="section-title" style="font-size: 0.85rem; color: var(--text-muted);">
                أو اختر المكونات المتوفرة لديك:
            </div>
            
            <div class="chips-grid">
                <span class="chip" onclick="toggleChip(this)">🐔 دجاج</span>
                <span class="chip" onclick="toggleChip(this)">🥔 بطاطس</span>
                <span class="chip" onclick="toggleChip(this)">🥚 بيض</span>
                <span class="chip" onclick="toggleChip(this)">🧀 جبن</span>
                <span class="chip" onclick="toggleChip(this)">🍞 خبز</span>
                <span class="chip" onclick="toggleChip(this)">🥛 حليب</span>
                <span class="chip" onclick="toggleChip(this)">🍝 معكرونة</span>
            </div>

            <button class="btn-primary" onclick="generateRecipe()">
                <i class="fa-solid fa-robot"></i> ابتكار الوصفة بالذكاء الاصطناعي
            </button>
        </div>

        <!-- التحميل -->
        <div class="loader" id="loader">
            <i class="fa-solid fa-spinner"></i>
            <p style="margin-top: 10px;">جاري ابتكار أحلى وصفة لك...</p>
        </div>

        <!-- نتيجة الوصفة -->
        <div class="recipe-card" id="recipeCard">
            <div class="recipe-title" id="resTitle">وجبة الشيف السريعة</div>
            <div class="recipe-meta">
                <span><i class="fa-regular fa-clock"></i> <span id="resTime">20 دقيقة</span></span>
                <span><i class="fa-solid fa-fire"></i> <span id="resCalories">350 سعرة</span></span>
            </div>
            <hr style="border: none; border-top: 1px solid #E2E8F0;">
            <div>
                <strong>المكونات:</strong>
                <ul class="ingredients-list" id="resIngredients"></ul>
            </div>
            <div>
                <strong>طريقة التحضير:</strong>
                <ol class="steps-list" id="resSteps"></ol>
            </div>
        </div>
    </div>
</div>

<script>
    function toggleChip(chip) {
        chip.classList.toggle('active');
        const input = document.getElementById('userInput');
        const activeChips = Array.from(document.querySelectorAll('.chip.active')).map(c => c.innerText.trim());
        if (activeChips.length > 0) {
            input.value = "المكونات المتاحة لدي: " + activeChips.join('، ');
        } else {
            input.value = "";
        }
    }

    function generateRecipe() {
        const text = document.getElementById('userInput').value.trim();
        if(!text) {
            alert('الرجاء كتابة طلبك أو اختيار المكونات أولاً!');
            return;
        }

        document.getElementById('loader').style.display = 'block';
        document.getElementById('recipeCard').style.display = 'none';

        // محاكاة استجابة الذكاء الاصطناعي لتوليد الوصفة
        setTimeout(() => {
            document.getElementById('loader').style.display = 'none';
            document.getElementById('recipeCard').style.display = 'flex';

            document.getElementById('resTitle').innerText = "صينية الدجاج بالبطاطس والجبن السريعة";
            document.getElementById('resTime').innerText = "15 دقيقة";
            document.getElementById('resCalories').innerText = "420 سعرة";

            document.getElementById('resIngredients').innerHTML = `
                <li>قطع دجاج مقطعة مكعبات</li>
                <li>حبتين بطاطس مسلوقة ومقطعة</li>
                <li>نصف كوب جبن موزاريلا</li>
                <li>ملعقة زيت زيتون، بهارات (ملح، فلفل، ثوم بودرة)</li>
            `;

            document.getElementById('resSteps').innerHTML = `
                <li>في مقلاة، سخني زيت الزيتون وشوحي مكعبات الدجاج مع البهارات حتى تنضج.</li>
                <li>أضيفي قطع البطاطس وشوحيها مع الدجاج لمدة 3 دقائق.</li>
                <li>وزعي الجبن على الوجه وغطي المقلاة لمدة دقيقتين حتى يذوب الجبن تماماً.</li>
                <li>يقدم ساخناً مع الخبز أو السلطة. وبالهناء والشفاء!</li>
            `;
        }, 1500);
    }
</script>

</body>
</html>
